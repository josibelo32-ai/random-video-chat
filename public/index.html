<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Video Chat</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,'Noto Sans Ethiopic',sans-serif;background:#0f1a20;color:#eaf2f5;min-height:100vh;display:flex;flex-direction:column}
  #gate{margin:auto;max-width:360px;padding:24px;text-align:center}
  #gate h1{margin:0 0 10px}
  #gate label{display:flex;gap:10px;text-align:left;margin:16px 0;font-size:14px;line-height:1.4}
  button{font:inherit;border:0;border-radius:12px;padding:14px 18px;cursor:pointer;background:#1b9a95;color:#04201F;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  #app{display:none;flex:1;flex-direction:column}
  .videos{position:relative;flex:1;background:#000;min-height:50vh}
  #remote{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  #local{position:absolute;right:10px;bottom:10px;width:28%;max-width:140px;border-radius:12px;border:2px solid #fff;background:#222;transform:scaleX(-1)}
  #status{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:18px;text-shadow:0 1px 4px #000}
  .bar{display:flex;gap:10px;padding:12px;justify-content:center}
  .bar .danger{background:#e04b4b;color:#fff}
  .bar .grey{background:#2a3b44;color:#eaf2f5}
</style>
</head>
<body>
<section id="gate">
  <h1>Random Video Chat</h1>
  <p>ከሌሎች ሰዎች ጋር በዘፈቀደ የቪዲዮ ውይይት።</p>
  <label><input type="checkbox" id="age"> እድሜዬ 18 ዓመትና ከዚያ በላይ መሆኑን አረጋግጣለሁ።</label>
  <label><input type="checkbox" id="rules"> አግባብ ያልሆነ ይዘት (እርቃንነት፣ ትንኮሳ፣ ጥላቻ) እንደማላሳይ እስማማለሁ። ባለጌ ተጠቃሚ ሪፖርት ሊደረግና ሊታገድ ይችላል።</label>
  <button id="start" disabled>ጀምር</button>
</section>

<section id="app">
  <div class="videos">
    <video id="remote" autoplay playsinline></video>
    <div id="status"></div>
    <video id="local" autoplay playsinline muted></video>
  </div>
  <div class="bar">
    <button id="next">ቀጣይ</button>
    <button id="report" class="danger">ሪፖርት</button>
    <button id="stop" class="grey">አቁም</button>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let ws, pc, stream;

const check = () => $('start').disabled = !($('age').checked && $('rules').checked);
$('age').onchange = $('rules').onchange = check;

$('start').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  } catch (e) { alert('ካሜራና ማይክ ፈቃድ ያስፈልጋል።'); return; }
  $('gate').style.display = 'none';
  $('app').style.display = 'flex';
  $('local').srcObject = stream;
  connect();
};

function status(t){ $('status').textContent = t; }

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host);
  ws.onopen = () => { status('አጋር በመፈለግ ላይ…'); ws.send(JSON.stringify({ type: 'join' })); };
  ws.onmessage = async (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'waiting') status('አጋር በመፈለግ ላይ…');
    if (m.type === 'banned') { status('ታግደሃል።'); ws.close(); }
    if (m.type === 'matched') { status('ተገናኘ…'); await startCall(m.initiator); }
    if (m.type === 'partner-left') { closeCall(); status('አጋርህ ወጥቷል። "ቀጣይ" ተጫን።'); }
    if (m.type === 'signal') await onSignal(m.data);
  };
  ws.onclose = () => status('ግንኙነት ተቋርጧል።');
}

const sig = d => ws.send(JSON.stringify({ type: 'signal', data: d }));

async function startCall(initiator) {
  closeCall();
  pc = new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.ontrack = e => { $('remote').srcObject = e.streams[0]; status(''); };
  pc.onicecandidate = e => e.candidate && sig({ candidate: e.candidate });
  if (initiator) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    sig({ sdp: pc.localDescription });
  }
}

async function onSignal(d) {
  if (!pc) return;
  if (d.sdp) {
    await pc.setRemoteDescription(d.sdp);
    if (d.sdp.type === 'offer') {
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      sig({ sdp: pc.localDescription });
    }
  } else if (d.candidate) {
    try { await pc.addIceCandidate(d.candidate); } catch {}
  }
}

function closeCall() {
  if (pc) { pc.close(); pc = null; }
  $('remote').srcObject = null;
}

$('next').onclick = () => { closeCall(); status('አጋር በመፈለግ ላይ…'); ws.send(JSON.stringify({ type: 'join' })); };
$('report').onclick = () => {
  if (!confirm('ይህን ተጠቃሚ ሪፖርት ማድረግ ትፈልጋለህ?')) return;
  closeCall(); status('ሪፖርት ተልኳል። አዲስ አጋር በመፈለግ ላይ…');
  ws.send(JSON.stringify({ type: 'report' }));
};
$('stop').onclick = () => {
  closeCall(); ws.close(); stream.getTracks().forEach(t => t.stop());
  $('app').style.display = 'none'; $('gate').style.display = 'block';
};
</script>
</body>
</html>
